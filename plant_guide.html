<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Care Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-100 flex items-center justify-center h-screen p-5 bg-cover bg-center relative" 
      style="background-image: url('bg6.jpg');">

    <!-- Home Icon -->
    <a href="home.html" class="absolute top-5 left-5 text-green-700 text-3xl hover:text-green-900">
        🏠
    </a>

    <!-- Main Box Container -->
    <div class="bg-white bg-opacity-75 p-8 rounded-2xl shadow-xl w-full max-w-4xl text-center">

        <!-- Title -->
        <h1 class="text-4xl font-bold text-green-700 mb-6">
            Plant Care Guide
        </h1>

        <!-- Search Bar -->
        <div class="relative mb-8 w-full max-w-md mx-auto">
            <input type="text" placeholder="Search for a plant..." 
                   class="w-full p-3 pl-10 border border-green-400 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-green-600">
            <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-green-600">
                🔍
            </span>
        </div>

        <!-- Plant Images Section -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-gray-200 p-4 rounded-xl shadow-lg h-48 flex items-center justify-center">
                <img src="pic1.jpg" alt="A healthy green plant in a pot" class="w-full h-full object-cover rounded-lg">
            </div>
            <div class="bg-gray-200 p-4 rounded-xl shadow-lg h-48 flex items-center justify-center">
                <img src="cute2.jpg" alt="A flowering houseplant with bright leaves" class="w-full h-full object-cover rounded-lg">
            </div>
            <div class="bg-gray-200 p-4 rounded-xl shadow-lg h-48 flex items-center justify-center">
                <img src="pic2.jpg" alt="A succulent in a small ceramic pot" class="w-full h-full object-cover rounded-lg">
            </div>
        </div>

    </div>

</body>
</html>
