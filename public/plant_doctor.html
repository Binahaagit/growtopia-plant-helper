<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Disease Symptoms</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('bg6.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }
        .home-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #fff;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
        }
        .home-button:hover {
            background: #ddd;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 600px;
            text-align: center;
            opacity: 75;
        }
        h2 {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        select, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: green;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background: darkgreen;
        }
    </style>
</head>
<body>
    <a href="home.html" class="home-button">🏠</a>
    <div class="container">
        <h2>Plant Disease Symptoms</h2>
        <form>
            <label for="symptom">Select a Symptom:</label>
            <select id="symptom" name="symptom">
                <option value="yellow_leaves">Yellow Leaves</option>
                <option value="wilting">Wilting</option>
                <option value="spots">Spots on Leaves</option>
                <option value="mold">Mold or Mildew</option>
                <option value="stunted">Stunted Growth</option>
            </select>
            
            <label for="details">Additional Details:</label>
            <textarea id="details" name="details" rows="4" placeholder="Describe the issue..."></textarea>
            
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
