<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Care Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-100 min-h-screen p-5" 
      style="background-image: url('bg6.jpg'); background-size: cover; background-position: center;">

    <!-- Home Icon -->
    <a href="home.html" class="absolute top-5 left-5 text-green-700 text-3xl hover:text-green-900">
        🏠
    </a>

    <!-- Main Container -->
    <div class="flex items-center justify-center min-h-screen">
        <div class="bg-white bg-opacity-90 p-8 rounded-2xl shadow-xl w-full max-w-4xl">

            <!-- Title -->
            <h1 class="text-4xl font-bold text-green-700 mb-2 text-center">
                🌿 Plant Care Guide with AI
            </h1>
            <p class="text-center text-gray-600 mb-8">Ask about any plant and get instant care tips!</p>

            <!-- Search Bar -->
            <div class="relative mb-8 w-full max-w-lg mx-auto">
                <input 
                    type="text" 
                    id="plantSearch"
                    placeholder="Search for a plant (e.g., Monstera, Pothos)..." 
                    class="w-full p-4 pl-12 border-2 border-green-400 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-green-600 text-lg"
                >
                <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-green-600 text-xl">
                    🔍
                </span>
                <button 
                    id="searchBtn"
                    class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition font-semibold"
                >
                    Search
                </button>
            </div>

            <!-- Loading State -->
            <div id="loading" class="hidden text-center mb-8">
                <div class="inline-block">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-green-600"></div>
                    <p class="text-green-600 mt-4 font-semibold">Getting AI insights...</p>
                </div>
            </div>

            <!-- Error State -->
            <div id="error" class="hidden bg-red-100 border-2 border-red-400 text-red-700 px-6 py-4 rounded-lg mb-8">
                <!-- Error message goes here -->
            </div>

            <!-- Results Container -->
            <div id="results" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <!-- Plant Image (if available) -->
                <div class="bg-gradient-to-br from-green-100 to-green-200 p-6 rounded-xl shadow-lg flex items-center justify-center h-64">
                    <div class="text-center">
                        <div class="text-6xl mb-4">🌱</div>
                        <p class="text-gray-600" id="plantImage">Plant Image</p>
                    </div>
                </div>

                <!-- Details Section -->
                <div class="space-y-4">
                    <h2 id="plantName" class="text-3xl font-bold text-green-700 mb-4"></h2>
                    
                    <div class="bg-green-50 p-4 rounded-lg border-l-4 border-green-600">
                        <p class="font-semibold text-green-800 mb-2">📝 Description</p>
                        <p id="description" class="text-gray-700"></p>
                    </div>

                    <div class="bg-blue-50 p-4 rounded-lg border-l-4 border-blue-600">
                        <p class="font-semibold text-blue-800 mb-2">💧 Watering</p>
                        <p id="watering" class="text-gray-700"></p>
                    </div>

                    <div class="bg-yellow-50 p-4 rounded-lg border-l-4 border-yellow-600">
                        <p class="font-semibold text-yellow-800 mb-2">☀️ Sunlight</p>
                        <p id="sunlight" class="text-gray-700"></p>
                    </div>
                </div>
            </div>

            <!-- Additional Details -->
            <div id="additionalDetails" class="hidden grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                <div class="bg-purple-50 p-4 rounded-lg border border-purple-300">
                    <p class="font-semibold text-purple-800 mb-2">🌡️ Temperature</p>
                    <p id="temperature" class="text-gray-700 text-sm"></p>
                </div>

                <div class="bg-cyan-50 p-4 rounded-lg border border-cyan-300">
                    <p class="font-semibold text-cyan-800 mb-2">💨 Humidity</p>
                    <p id="humidity" class="text-gray-700 text-sm"></p>
                </div>

                <div class="bg-orange-50 p-4 rounded-lg border border-orange-300">
                    <p class="font-semibold text-orange-800 mb-2">🌍 Soil</p>
                    <p id="soil" class="text-gray-700 text-sm"></p>
                </div>

                <div class="bg-red-50 p-4 rounded-lg border border-red-300">
                    <p class="font-semibold text-red-800 mb-2">🧪 Fertilizer</p>
                    <p id="fertilizer" class="text-gray-700 text-sm"></p>
                </div>

                <div class="bg-pink-50 p-4 rounded-lg border border-pink-300">
                    <p class="font-semibold text-pink-800 mb-2">🐛 Common Pests</p>
                    <p id="pests" class="text-gray-700 text-sm"></p>
                </div>

                <div class="bg-indigo-50 p-4 rounded-lg border border-indigo-300">
                    <p class="font-semibold text-indigo-800 mb-2">💡 Pro Tips</p>
                    <p id="tips" class="text-gray-700 text-sm"></p>
                </div>
            </div>

            <!-- Sample Plants -->
            <div class="mt-12 border-t-2 border-gray-300 pt-8">
                <p class="text-center text-gray-600 mb-4 font-semibold">Try searching for these plants:</p>
                <div class="flex flex-wrap gap-3 justify-center">
                    <button class="sample-plant bg-green-100 hover:bg-green-200 text-green-800 px-4 py-2 rounded-full transition font-semibold" data-plant="Monstera">Monstera</button>
                    <button class="sample-plant bg-green-100 hover:bg-green-200 text-green-800 px-4 py-2 rounded-full transition font-semibold" data-plant="Pothos">Pothos</button>
                    <button class="sample-plant bg-green-100 hover:bg-green-200 text-green-800 px-4 py-2 rounded-full transition font-semibold" data-plant="Snake Plant">Snake Plant</button>
                    <button class="sample-plant bg-green-100 hover:bg-green-200 text-green-800 px-4 py-2 rounded-full transition font-semibold" data-plant="Peace Lily">Peace Lily</button>
                    <button class="sample-plant bg-green-100 hover:bg-green-200 text-green-800 px-4 py-2 rounded-full transition font-semibold" data-plant="Aloe Vera">Aloe Vera</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_URL = '/api/plant-guide';

        async function searchPlant(plantName) {
            if (!plantName.trim()) {
                showError('Please enter a plant name');
                return;
            }

            document.getElementById('error').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');
            document.getElementById('additionalDetails').classList.add('hidden');

            try {
                const response = await fetch(`${API_URL}?name=${encodeURIComponent(plantName)}`);
                const data = await response.json();

                if (response.ok && !data.error) {
                    displayPlantDetails(data);
                } else {
                    showError(data.error || 'Plant not found. Try another name.');
                }
            } catch (error) {
                showError('Error fetching plant data: ' + error.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function displayPlantDetails(plant) {
            document.getElementById('plantName').textContent = plant.name || 'Unknown Plant';
            document.getElementById('description').textContent = plant.description || 'No description available.';
            document.getElementById('watering').textContent = plant.wateringSchedule || 'N/A';
            document.getElementById('sunlight').textContent = plant.sunlight || 'N/A';
            document.getElementById('temperature').textContent = plant.temperature || 'N/A';
            document.getElementById('humidity').textContent = plant.humidity || 'N/A';
            document.getElementById('soil').textContent = plant.soil || 'N/A';
            document.getElementById('fertilizer').textContent = plant.fertilizer || 'N/A';
            document.getElementById('pests').textContent = (plant.commonPests || []).join(', ') || 'None common';
            document.getElementById('tips').textContent = (plant.tips || []).slice(0, 2).join(' • ') || 'No tips available';

            document.getElementById('results').classList.remove('hidden');
            document.getElementById('additionalDetails').classList.remove('hidden');
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        // Event Listeners
        document.getElementById('searchBtn').addEventListener('click', () => {
            const plantName = document.getElementById('plantSearch').value;
            searchPlant(plantName);
        });

        document.getElementById('plantSearch').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const plantName = document.getElementById('plantSearch').value;
                searchPlant(plantName);
            }
        });

        // Sample plant buttons
        document.querySelectorAll('.sample-plant').forEach(btn => {
            btn.addEventListener('click', () => {
                const plantName = btn.getAttribute('data-plant');
                document.getElementById('plantSearch').value = plantName;
                searchPlant(plantName);
            });
        });
    </script>

</body>
</html>
